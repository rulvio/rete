name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that supersedes an in-flight run makes that run irrelevant, and the
# dialyzer job is slow enough to be worth not paying for twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The declared floor and the current release. The floor is what `elixir: "~> 1.18"`
  # in mix.exs promises, and nothing enforces that promise except running it.
  # Versions are partial on purpose: setup-beam resolves the latest matching patch,
  # so a patch release cannot break the build by not existing.
  test:
    name: test (elixir ${{ matrix.elixir }} / otp ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.20"
            otp: "29"

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      # Warnings are errors here for the same reason they are locally: the DSL
      # generates functions, and an unused-variable warning in generated code is
      # usually a binding that was classified wrong.
      - run: mix compile --warnings-as-errors

      - run: mix test --warnings-as-errors

  # Format, lint and types do not vary with the Elixir version in any way worth
  # paying for, so they run once on the current release.
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Restore deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      # A lock file holding something mix.exs no longer asks for is a dependency
      # nobody decided to have.
      - run: mix deps.unlock --check-unused

      - run: mix compile --warnings-as-errors

      - run: mix format --check-formatted

      - run: mix credo --strict

      # The PLT is the expensive part and only changes when the dependencies or
      # the Erlang version do, so it is cached on its own key. Built as a
      # separate step so that "the PLT could not be built" and "dialyzer found
      # something" are different red crosses.
      - name: Restore dialyzer PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix dialyzer --plt

      - run: mix dialyzer --format github

  # The shape check, and the one thing that catches this engine's real failure mode: an
  # operation that proves quadratic in something a session accumulates. It runs once, on
  # the current release, because the shape of a scenario does not vary with the Elixir
  # version.
  #
  # An exponent is a ratio between two timings, so the speed of the runner has no effect
  # on it. Measured at 2 and at 4 schedulers, and under 3x CPU oversubscription, the worst
  # of the eighteen readings moved from n^1.12 to n^1.13. The gate is n^1.5. Wall clock is
  # still asserted on nowhere.
  bench:
    name: bench
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.20"
          otp-version: "29"

      # Reads the build `quality` writes, and saves nothing. `cache/restore` rather than
      # `cache`, so two jobs never race to save one key and the project is not cached
      # twice. On the run that first sees a new `mix.lock` there is nothing to restore,
      # because the two jobs are concurrent and `quality` saves at its end. That run
      # compiles from scratch here, and every run after it does not.
      - name: Restore deps and build
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      # One run, and no retry. A scenario that fails once in a while is a scenario sitting
      # too near the gate, and that is worth knowing about rather than passing on the
      # second attempt.
      - run: mix bench
